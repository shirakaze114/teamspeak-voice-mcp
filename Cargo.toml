[package]
name = "tsvoice_mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-openai = { version = "0.42", default-features = false, features = ["rustls", "audio"] }
audiopus = "0.3.0-rc.0"
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1.2.2"
futures = "0.3"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2"] }
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
rubato = "5"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silero = "0.7"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "io-std", "io-util", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.20"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
uuid = { version = "1.29.0", features = ["v4"] }
